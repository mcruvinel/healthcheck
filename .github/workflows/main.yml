name: Health Monitor

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:       

permissions:
  contents: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests --quiet

      - name: Run healthcheck
        env:
          MONITOR_URL: ${{ vars.MONITOR_URL }}
        run: python scripts/healthcheck.py

      - name: Commit & push data
        run: |
          git config user.name  "mcruvinel"
          git config user.email "matheuscruvinel@hotmail.com"
          git add data/checks.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u "+%Y-%m-%d %H:%M UTC")
            git commit -m "monitor: healthcheck $TIMESTAMP"
            git push
          fi
